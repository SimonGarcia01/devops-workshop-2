apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ldap

  template:
    metadata:
      labels:
        app: ldap

    spec:
      containers:
        - name: ldap
          image: osixia/openldap:1.5.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 389
            - containerPort: 636

          env:
            - name: LDAP_ORGANISATION
              value: "CircleGuard"

            - name: LDAP_DOMAIN
              value: "circleguard.edu"

            - name: LDAP_ADMIN_PASSWORD
              value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-service
  namespace: dev

spec:
  selector:
    app: ldap

  ports:
    - name: ldap
      port: 389
      targetPort: 389

    - name: ldaps
      port: 636
      targetPort: 636

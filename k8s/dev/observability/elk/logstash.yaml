apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: dev
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }

    filter {
      if [message] {
        mutate {
          add_field => {
            "environment" => "dev"
            "platform"    => "circleguard"
          }
        }
      }

      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }

      mutate {
        remove_field => ["timestamp"]
      }
    }

    output {
      elasticsearch {
        hosts       => ["elasticsearch-service:9200"]
        index       => "circleguard-logs-%{+YYYY.MM.dd}"
        action      => "index"
      }
      stdout {
        codec => rubydebug
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.13.0
          ports:
            - containerPort: 5000
            - containerPort: 9600
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline

---
apiVersion: v1
kind: Service
metadata:
  name: logstash-service
  namespace: dev
spec:
  selector:
    app: logstash
  ports:
    - name: tcp-input
      port: 5000
      targetPort: 5000
    - name: monitoring
      port: 9600
      targetPort: 9600

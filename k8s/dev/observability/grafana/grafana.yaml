apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: dev
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-service:16686
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: dev
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: CircleGuard
        folder: CircleGuard
        type: file
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-circleguard
  namespace: dev
data:
  circleguard-overview.json: |
    {
      "title": "CircleGuard Overview",
      "uid": "circleguard-overview",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Services UP",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "count(up == 1)", "legendFormat": "UP" }]
        },
        {
          "id": 2, "type": "stat", "title": "Services DOWN",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "count(up == 0) or vector(0)", "legendFormat": "DOWN" }],
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0},{"color":"red","value":1}] } } }
        },
        {
          "id": 3, "type": "timeseries", "title": "HTTP Request Rate (req/s)",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 4, "type": "timeseries", "title": "Error Rate (5xx %)",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (job) / sum(rate(http_server_requests_seconds_count[1m])) by (job) * 100", "legendFormat": "{{job}}" }]
        },
        {
          "id": 5, "type": "timeseries", "title": "Response Time p95 (ms)",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le)) * 1000", "legendFormat": "{{job}} p95" }]
        },
        {
          "id": 6, "type": "timeseries", "title": "JVM Heap Usage (%)",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "jvm_memory_used_bytes{area=\"heap\"} / jvm_memory_max_bytes{area=\"heap\"} * 100", "legendFormat": "{{job}}" }]
        },
        {
          "id": 7, "type": "timeseries", "title": "[Business] Gate Validations / min",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{job=\"gateway-service\", uri=~\".*gate.*validate.*\"}[1m])) * 60", "legendFormat": "gate validations/min" }]
        },
        {
          "id": 8, "type": "timeseries", "title": "[Business] Survey Submissions / min",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{job=\"form-service\", uri=~\".*surveys.*\", method=\"POST\"}[1m])) * 60", "legendFormat": "surveys/min" }]
        },
        {
          "id": 9, "type": "timeseries", "title": "[Business] Login Rate / min",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{job=\"auth-service\", uri=~\".*login.*\", method=\"POST\"}[1m])) * 60", "legendFormat": "logins/min" }]
        },
        {
          "id": 10, "type": "timeseries", "title": "Kafka Consumer Lag",
          "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
          "targets": [{ "expr": "kafka_consumer_fetch_manager_records_lag_max", "legendFormat": "{{job}} lag" }]
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-json
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-json
          configMap:
            name: grafana-dashboard-circleguard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['auth-service:8180']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: auth-service

      - job_name: identity-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['identity-service:8083']

      - job_name: gateway-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway-service:8087']

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8082']

      - job_name: promotion-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['promotion-service:8088']

      - job_name: dashboard-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['dashboard-service:8084']

      - job_name: form-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['form-service:8086']

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: dev
data:
  alert-rules.yml: |
    groups:
      - name: circleguard.service_health
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is DOWN"
              description: "{{ $labels.job }} has been unreachable for more than 1 minute."

          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
              /
              sum(rate(http_server_requests_seconds_count[5m])) by (job)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.job }}"
              description: "{{ $labels.job }} error rate > 5% for 5 minutes."

          - alert: SlowResponseTime
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le)
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Slow responses on {{ $labels.job }}"
              description: "p95 response time > 2s for 5 minutes."

          - alert: JVMMemoryHigh
            expr: |
              jvm_memory_used_bytes{area="heap"}
              /
              jvm_memory_max_bytes{area="heap"}
              > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "JVM heap > 85% on {{ $labels.job }}"
              description: "Heap usage is critically high — GC pressure likely."

          - alert: KafkaConsumerLagHigh
            expr: kafka_consumer_fetch_manager_records_lag_max > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag high on {{ $labels.job }}"
              description: "Consumer is falling behind — possible processing bottleneck."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: alert-rules
              mountPath: /etc/prometheus/alert-rules.yml
              subPath: alert-rules.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: alert-rules
          configMap:
            name: prometheus-alert-rules

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30900

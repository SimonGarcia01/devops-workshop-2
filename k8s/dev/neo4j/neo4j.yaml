apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 7474
            - containerPort: 7687

          env:
            - name: NEO4J_AUTH
              value: "neo4j/password"

            - name: NEO4J_PLUGINS
              value: '["apoc"]'

            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"

          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 40
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  namespace: dev
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474

    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP

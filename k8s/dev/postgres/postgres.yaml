apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: dev
data:
  init-db.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE identity_db;
    CREATE DATABASE promotion_db;

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: admin

            - name: POSTGRES_PASSWORD
              value: password

            - name: POSTGRES_DB
              value: postgres

          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: dev

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: identity-service

  template:
    metadata:
      labels:
        app: identity-service

    spec:
      containers:
        - name: identity-service
          image: simongarcia01/identity-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8083

          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:9092

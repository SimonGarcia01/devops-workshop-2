# Gestión segura de secretos — K8s Secrets con stringData.
# K8s codifica automáticamente a base64 en etcd.
# En producción usar HashiCorp Vault o Sealed Secrets (Bitnami).
#
# Aplicar: kubectl apply -f k8s/dev/security/secrets.yaml
# Verificar: kubectl get secrets -n dev

---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-db-credentials
  namespace: dev
  labels:
    app.kubernetes.io/part-of: circleguard
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-ldap-credentials
  namespace: dev
  labels:
    app.kubernetes.io/part-of: circleguard
type: Opaque
stringData:
  SPRING_LDAP_USERNAME: "cn=admin,dc=circleguard,dc=edu"
  SPRING_LDAP_PASSWORD: "admin"

---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-auth-keys
  namespace: dev
  labels:
    app.kubernetes.io/part-of: circleguard
type: Opaque
stringData:
  JWT_SECRET: "my-super-secret-dev-key-32-chars-long-12345678"
  QR_SECRET: "my-qr-secret-key-for-dev-1234567890"

---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-neo4j-credentials
  namespace: dev
  labels:
    app.kubernetes.io/part-of: circleguard
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/password"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "password"

---
# Ejemplo de referencia en un Deployment (fragmento):
#
#   env:
#     - name: SPRING_DATASOURCE_PASSWORD
#       valueFrom:
#         secretKeyRef:
#           name: circleguard-db-credentials
#           key: POSTGRES_PASSWORD
#     - name: JWT_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: circleguard-auth-keys
#           key: JWT_SECRET

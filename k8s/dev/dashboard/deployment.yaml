apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dashboard-service

  template:
    metadata:
      labels:
        app: dashboard-service

    spec:
      containers:
        - name: dashboard-service
          image: simongarcia01/dashboard-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8084

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/dashboard_db

            - name: SPRING_DATASOURCE_USERNAME
              value: admin

            - name: SPRING_DATASOURCE_PASSWORD
              value: password

            - name: CIRCLEGUARD_PROMOTION_SERVICE_URL
              value: http://promotion-service:8088

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
        - name: gateway-service
          image: simongarcia01/gateway-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8087

          env:
            - name: REDIS_HOST
              value: redis-service

            - name: REDIS_PORT
              value: "6379"

            - name: JWT_SECRET
              value: "this-is-a-super-long-gateway-secret-key-for-testing-123456789"

            - name: JWT_EXPIRATION
              value: "3600000"

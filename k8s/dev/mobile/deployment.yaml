apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-web
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mobile-web

  template:
    metadata:
      labels:
        app: mobile-web

    spec:
      containers:
        - name: mobile-web
          image: mobile-web:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

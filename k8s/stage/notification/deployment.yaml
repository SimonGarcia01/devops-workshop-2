apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      serviceAccountName: notification-service
      containers:
        - name: notification-service
          image: simongarcia01/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: stage
            - name: AUTH_API_URL
              value: http://auth-service:8180
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service:9092
            - name: MAIL_HOST
              value: dummy
            - name: MAIL_PORT
              value: "0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-auth-keys
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "3600000"
            - name: QR_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-auth-keys
                  key: QR_SECRET
            - name: QR_EXPIRATION
              value: "300"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

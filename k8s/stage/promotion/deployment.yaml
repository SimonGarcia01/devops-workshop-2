apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      serviceAccountName: promotion-service
      containers:
        - name: promotion-service
          image: simongarcia01/promotion-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: stage
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/promotion_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: circleguard-db-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-db-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_NEO4J_URI
              value: bolt://neo4j-service:7687
            - name: SPRING_NEO4J_AUTHENTICATION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: circleguard-neo4j-credentials
                  key: NEO4J_USERNAME
            - name: SPRING_NEO4J_AUTHENTICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-neo4j-credentials
                  key: NEO4J_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service:9092
            - name: SPRING_DATA_REDIS_HOST
              value: redis-service
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-auth-keys
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "3600000"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

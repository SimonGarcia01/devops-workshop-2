apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: simongarcia01/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8180
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: circleguard-db-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-db-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_LDAP_URLS
              value: ldap://ldap-service:389
            - name: SPRING_LDAP_BASE
              value: dc=circleguard,dc=edu
            - name: SPRING_LDAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: circleguard-ldap-credentials
                  key: SPRING_LDAP_USERNAME
            - name: SPRING_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-ldap-credentials
                  key: SPRING_LDAP_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-auth-keys
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "3600000"
            - name: QR_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-auth-keys
                  key: QR_SECRET
            - name: QR_EXPIRATION
              value: "300"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8180
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8180
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

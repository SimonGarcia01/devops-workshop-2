spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: "this-is-a-super-long-development-secret-key-for-circle-guard-testing-123456789"

vault:
  secret: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536" # hex for "test-secret-..."
  salt: "deadbeef" # hex for encryption
  hash-salt: "12345678" # hex for hashing

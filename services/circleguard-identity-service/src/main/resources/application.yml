spring:
  application:
    name: circleguard-identity-service

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://postgres-service:5432/identity_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    table: flyway_schema_history_identity

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}

vault:
  secret: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536"
  salt: "deadbeef"
  hash-salt: "12345678"

jwt:
  secret: "1234567890123456789012345678901234567890123456789012345678901234"

server:
  port: 8083

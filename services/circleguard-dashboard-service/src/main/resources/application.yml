spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_dashboard
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# External Configuration Pattern — URL y parámetros del promotion-service
circleguard:
  promotion-service-url: ${CIRCLEGUARD_PROMOTION_SERVICE_URL:http://promotion-service:8088}
  analytics-k-anonymity-threshold: ${CIRCLEGUARD_K_ANONYMITY_THRESHOLD:5}
  promotion-service-timeout-ms: ${CIRCLEGUARD_PROMOTION_TIMEOUT_MS:3000}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: circleguard-dashboard-service
      environment: ${ENVIRONMENT:dev}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger-service:4318/v1/traces

logging:
  pattern:
    console: "%d{ISO8601} %5p [%X{traceId:-},%X{spanId:-}] [circleguard-dashboard-service] %logger{36} --- %m%n"

# Circuit Breaker Pattern — Resilience4j config para llamadas a promotion-service
resilience4j:
  circuitbreaker:
    instances:
      promotionService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50           # Abre el CB si >50% de llamadas fallan
        wait-duration-in-open-state: 30s     # Tiempo en estado OPEN antes de HALF-OPEN
        permitted-number-of-calls-in-half-open-state: 2
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        register-health-indicator: true       # Expone estado en /actuator/health

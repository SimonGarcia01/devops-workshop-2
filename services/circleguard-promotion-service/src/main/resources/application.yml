spring:
  application:
    name: circleguard-promotion-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-service:5432/promotion_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    table: flyway_schema_history_promotion

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://neo4j-service:7687}

    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:password}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}

    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-service}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# External Configuration Pattern — parámetros de negocio de CircleGuard
# Complementa SystemSettings (BD, cambios en runtime) con config estática de startup.
# Los nombres de Kafka topics son críticos: cambiarlos sin redespliegue rompería
# la integración con form-service y notification-service.
circleguard:
  kafka:
    topic-status-changed: ${CIRCLEGUARD_KAFKA_TOPIC_STATUS_CHANGED:promotion.status.changed}
    topic-survey-submitted: ${CIRCLEGUARD_KAFKA_TOPIC_SURVEY_SUBMITTED:survey.submitted}
    topic-certificate-validated: ${CIRCLEGUARD_KAFKA_TOPIC_CERT_VALIDATED:certificate.validated}
  fence:
    default-mandatory-days: ${CIRCLEGUARD_FENCE_MANDATORY_DAYS:14}
    default-encounter-window-days: ${CIRCLEGUARD_FENCE_ENCOUNTER_WINDOW_DAYS:14}
    default-auto-threshold-seconds: ${CIRCLEGUARD_FENCE_AUTO_THRESHOLD_SECONDS:3600}

server:
  port: 8088

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: circleguard-promotion-service
      environment: ${ENVIRONMENT:dev}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger-service:4318/v1/traces

logging:
  pattern:
    console: "%d{ISO8601} %5p [%X{traceId:-},%X{spanId:-}] [circleguard-promotion-service] %logger{36} --- %m%n"

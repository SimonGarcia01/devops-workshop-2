spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: this-is-a-very-long-test-secret-key-for-jwt-signing-123456789
  expiration: 3600000

qr:
  secret: this-is-a-very-long-test-secret-key-for-qr-signing-123456789
  expiration: 300
